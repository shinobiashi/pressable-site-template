name: Lint

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: composer lint

  deployignore:
    name: Deploy contents (theme and plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pressable deploys the theme and the plugin as whole folders, so no
      # development file may be tracked inside them, and each must be reopened
      # in .deployignore.
      - run: bash bin/check-deployignore.sh

  # rename-site:start
  # Template only. rename.py --remove-skill deletes this job from a new site's repository.
  rename-skill:
    name: rename-site skill tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: python3 -I .claude/skills/rename-site/scripts/test_rename.py
  # rename-site:end

  blocks:
    name: Blocks (lint and build check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blocks
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: blocks/.nvmrc
          cache: npm
          cache-dependency-path: blocks/package-lock.json

      - run: npm ci

      - run: npm run lint:js

      - run: npm run build

      # Pressable does not build on deploy, so the committed build/ of the plugin
      # must match blocks/src/.
      - name: Check that build/ is committed and up to date
        run: |
          if [ -n "$(git status --porcelain -- ../wp-content/plugins/pressable-plugin/build)" ]; then
            git status --porcelain -- ../wp-content/plugins/pressable-plugin/build
            echo "::error::wp-content/plugins/pressable-plugin/build/ is out of date. Run 'npm run build' in blocks/ and commit the result."
            exit 1
          fi
